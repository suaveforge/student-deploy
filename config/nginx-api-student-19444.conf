# W01 Student only. Do not listen on 80 or 443, and do not import shared proxies.
server {
    listen 19444 ssl;
    server_name api-student.suaveforge.com;
    ssl_certificate /etc/nginx/student-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/student-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:STUDENTSSL:5m;
    ssl_session_timeout 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-store always;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
