services:
  student:
    image: ghcr.io/suaveforge/student:${STUDENT_SOURCE_SHA:?set_STUDENT_SOURCE_SHA}
    container_name: suaveforge_student_w01
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DBFILE: /app/data/mvp.sqlite
      COOKIE_SECURE: "1"
      RECORD_BASE_URL: https://student.suaveforge.com
      RECORDER_PYTHON: /opt/w01-python/bin/python
      CHROME_BIN: /usr/bin/google-chrome-stable
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - student_data:/app/data
      - student_artifacts:/app/artifacts
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  student_data:
    name: suaveforge_student_data
  student_artifacts:
    name: suaveforge_student_artifacts
