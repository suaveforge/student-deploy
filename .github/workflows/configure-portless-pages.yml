name: W01 verify portless Pages domain and certificate state (read only)
on:
  push:
    branches: [main]
    paths: [CNAME, .github/workflows/configure-portless-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read existing Pages custom hostname and certificate state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat CNAME)" = "student.suaveforge.com"
          response=$(gh api "/repos/$GITHUB_REPOSITORY/pages")
          echo "$response" | jq -c '{cname,https_enforced,certificate_state:(.https_certificate.state // "unknown")}'
          configured=$(echo "$response" | jq -r '.cname // ""')
          test "$configured" = "student.suaveforge.com"
          echo STUDENT_PORTLESS_PAGES_DOMAIN_CONFIG=PASS
