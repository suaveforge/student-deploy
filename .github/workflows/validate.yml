name: Student server123 deployment scripts validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact independent Student deployment script set
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in scripts/deploy-student-server123.sh scripts/configure-student-dns-server123.sh scripts/configure-student-caddy-server123.sh; do
            test -f "$script"
            bash -n "$script"
          done
          ! test -f server.mjs
          ! test -f public/index.html
          echo STUDENT_DEPLOY_REPO_SCRIPT_VALIDATION=PASS
      - name: Reject secrets, DBs, MP4s and node_modules
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -E '(^\.env$|\.sqlite$|\.mp4$|(^|/)node_modules/)'; then
            echo STUDENT_DEPLOY_REPO_FORBIDDEN_FILES >&2
            exit 1
          fi
          echo STUDENT_DEPLOY_REPO_ISOLATION=PASS
